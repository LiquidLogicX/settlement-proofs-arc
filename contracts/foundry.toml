[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
arc_mainnet = "https://rpc.mainnet.arc.io"
arc_testnet = "${ARC_TESTNET_RPC_URL}"
base_mainnet = "${BASE_RPC_URL}"
moderato = "https://rpc.moderato.tempo.xyz"
tempo_testnet = "https://rpc.moderato.tempo.xyz"

# explorer.arc.io/api is behind Cloudflare and must not be used for programmatic
# verify. Runtime / CI verification uses https://rpc.mainnet.arc.io (eth_call).
# Do not re-add an [etherscan] arc_mainnet url pointing at explorer.arc.io/api.
# Human reviewers open https://explorer.arc.io root pages in a browser.

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
