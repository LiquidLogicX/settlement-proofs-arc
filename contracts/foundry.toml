[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
arc_mainnet = "https://rpc.mainnet.arc.io"
arc_testnet = "${ARC_TESTNET_RPC_URL}"
base_mainnet = "${BASE_RPC_URL}"

[etherscan]
arc_mainnet = { key = "${ARCSCAN_API_KEY}", url = "https://explorer.arc.io/api", chain = 5042 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
