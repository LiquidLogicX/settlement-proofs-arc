# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: arc-settlement-recorder
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./recorder/Dockerfile
    dockerContext: ./recorder
    healthCheckPath: /health
    envVars:
      # --- Arc rail (Base payment → Arc proof) ---
      - key: HOST
        value: "0.0.0.0"
      - key: BASE_RPC_URL
        sync: false
      - key: ARC_RPC_URL
        sync: false
      - key: SETTLEMENT_PROOFS_ADDRESS
        sync: false
      - key: SETTLEMENT_RECORDER_PRIVATE_KEY
        sync: false
      - key: RECORDER_API_KEY
        sync: false
      - key: MIN_CONFIRMATIONS
        value: "12"
      # --- Tempo rail (Tempo payment → Tempo proof). Names only; Miles pastes secrets in Render UI.
      # See docs/render-tempo-env.md. Leave TEMPO_* unset until Miles enables the rail.
      - key: TEMPO_SETTLEMENT_PROOFS_ADDRESS
        sync: false
      - key: TEMPO_RECORDER_PRIVATE_KEY
        sync: false
      - key: TEMPO_RPC_URL
        sync: false
      - key: TEMPO_EXPLORER
        sync: false
      - key: TEMPO_MIN_CONFIRMATIONS
        sync: false
      - key: TEMPO_FEE_TOKEN
        sync: false
      - key: TEMPO_ALLOWED_TOKENS
        sync: false
      - key: TEMPO_MIN_RECORDER_FEE_BALANCE
        sync: false
      - key: PUBLIC_VERIFIER_URL
        sync: false
      # TEMPO_ALLOW_MAINNET: set to "true" in the Render UI only together with the full mainnet set in
      # docs/render-tempo-env.md#tempo-mainnet-switch-over (Miles approved 2026-10-05; Miles pastes values).
